apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nttdata-ingress
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
spec:
  rules:
    - host: api.tu-dominio.com  
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nttdata
                port:
                  number: 8080
