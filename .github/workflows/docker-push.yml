name: Docker Build & Push

on:
  workflow_call:
    inputs:
      target:
        description: "onpremise (Docker Hub) o cloud (ECR)"
        type: string
        required: true
      dockerhub-repository:
        type: string
        default: ""
      ecr-repository:
        type: string
        default: ""
      aws-region:
        type: string
        default: "us-east-1"
      mutable-tag:
        type: string
        default: "dev"
      scan-image:
        description: "Escanear con Trivy antes de pushear (recomendado en cloud)"
        type: boolean
        default: false
      dockerhub-username:
        description: "Username para dockerhub"
        type: string
        default: ""
    outputs:
      image:
        description: "Imagen final con tag = sha, lista para el deploy"
        value: ${{ jobs.docker-push.outputs.image }}
    secrets:
      DOCKERHUB_TOKEN:
        required: false
      AWS_GITHUB_ACTIONS_ROLE_ARN:
        required: false

jobs:
  docker-push:
    name: Docker Build & Push (${{ inputs.target }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Restaurar jar
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: target/


      - name: Login en Docker Hub
        if: ${{ inputs.target == 'onpremise' }}
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar credenciales AWS (OIDC)
        if: ${{ inputs.target == 'cloud' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login en Amazon ECR
        id: login-ecr
        if: ${{ inputs.target == 'cloud' }}
        uses: aws-actions/amazon-ecr-login@v2


      - name: Resolver nombre base de la imagen
        id: vars
        run: |
          if [ "${{ inputs.target }}" = "cloud" ]; then
            echo "image_base=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_base=${{ inputs.dockerhub-username }}/${{ inputs.dockerhub-repository }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build imagen
        run: docker build -t ${{ steps.vars.outputs.image_base }}:${{ github.sha }} .

      - name: Instalar Trivy
        if: ${{ inputs.scan-image }}
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.73.0
          cache: true

      - name: Escanear imagen con Trivy
        if: ${{ inputs.scan-image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image_base }}:${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Push imagen 
        id: push
        run: |
          docker push ${{ steps.vars.outputs.image_base }}:${{ github.sha }}
          docker tag ${{ steps.vars.outputs.image_base }}:${{ github.sha }} ${{ steps.vars.outputs.image_base }}:${{ inputs.mutable-tag }}
          docker push ${{ steps.vars.outputs.image_base }}:${{ inputs.mutable-tag }}
          echo "image=${{ steps.vars.outputs.image_base }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
