name: CI-DEV-JAVA
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo workspace actions
        uses: actions/checkout@v7

      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Compilar Java
        run: mvn -B clean compile

      - name: compartir compilacion
        uses: actions/upload-artifact@v7
        with:
          name: compilacion-and-generate-artifact
          path: target/

  test:
    name: Pruebas unitarias
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo workspace actions
        uses: actions/checkout@v7
        
      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Restaurar binario compilado en build
        uses: actions/download-artifact@v7
        with:
          name: compilacion-and-generate-artifact
          path: target/
      - name: Ejecutar pruebas unitarias
        run: mvn -B test
  
  package:
    name: Empaquetar codigo
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo workspace actions
        uses: actions/checkout@v7
      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Restaurar binario compilado en build
        uses: actions/download-artifact@v7
        with:
          name: compilacion-and-generate-artifact
          path: target/
      - name: Ejecutar pruebas unitarias
        run: mvn clean package -DskipTests
  
  public-nexus:
    name: Publicar en Nexus
    needs: package
    runs-on: self-hosted
    steps:
      - name: Clone repo workspace actions
        uses: actions/checkout@v7
      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Restaurar binario compilado en build
        uses: actions/download-artifact@v7
        with:
          name: compilacion-and-generate-artifact
          path: target/
      - name: Extraer Parametros de Jar
        id: extraer_parametros
        run: |
          GROUP_ID=$(mvn -q -B help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn -q -B help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "group_id=$GROUP_ID" >> $GITHUB_OUTPUT
          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determinando carpeta de destino en Nexus
        id: determinar_destino
        env:
          NEXUS_RELEASES_URL: ${{ vars.NEXUS_RELEASES_URL }}
          NEXUS_SNAPSHOTS_URL: ${{ vars.NEXUS_SNAPSHOTS_URL }}
        run: |
          if [[ ${{ steps.extraer_parametros.outputs.version }} == *-SNAPSHOT ]]; then
            echo "destino=$NEXUS_SNAPSHOTS_URL" >> $GITHUB_OUTPUT
          else
            echo "destino=$NEXUS_RELEASES_URL" >> $GITHUB_OUTPUT
          fi

      - name: Publicar en Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl -sSf -u ${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -F "maven2.groupId=${{ steps.extraer_parametros.outputs.group_id }}" \
            -F "maven2.artifactId=${{ steps.extraer_parametros.outputs.artifact_id }}" \
            -F "maven2.version=${{ steps.extraer_parametros.outputs.version }}" \
            "http://localhost:8081/service/rest/v1/components?repository=${{ steps.determinar_destino.outputs.destino }}" 
               



