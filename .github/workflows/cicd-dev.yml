name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      deploy-target:
        description: "Forzar destino (si no lo tocas, usa la variable DEPLOY_TARGET del repo)"
        type: choice
        options: [onpremise, cloud]

env:
  DEPLOY_TARGET: ${{ github.event.inputs.deploy-target || vars.DEPLOY_TARGET }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    needs: build
    uses: ./.github/workflows/test.yml

  package:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      skip-tests: false

  sonar-analysis:
    needs: package
    if: ${{ vars.ENABLE_SONAR == 'true' }}
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  nexus-publish:
    needs: [package, sonar-analysis]
    if: ${{ always() && !failure() && !cancelled() }}
    uses: ./.github/workflows/nexus-publish.yml
    with:
      runner: ${{ vars.NEXUS_RUNNER || 'ubuntu-latest' }}
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}


  docker-push:
    needs: nexus-publish
    uses: ./.github/workflows/docker-push.yml
    with:
      target: ${{ env.DEPLOY_TARGET }}
      dockerhub-repository: ${{ vars.DOCKERHUB_REPOSITORY }}
      ecr-repository: ${{ vars.ECR_REPOSITORY }}
      aws-region: ${{ vars.AWS_REGION }}
      mutable-tag: dev
      scan-image: ${{ env.DEPLOY_TARGET == 'cloud' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}


  deploy:
    needs: docker-push
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      cluster-type: ${{ env.DEPLOY_TARGET == 'cloud' && 'eks' || 'minikube' }}
      runner: ${{ env.DEPLOY_TARGET == 'cloud' && 'ubuntu-latest' || 'self-hosted' }}
      namespace: ${{ env.DEPLOY_TARGET == 'cloud' && vars.NAMESPACE_CLOUD || vars.NAMESPACE_ONPREM }}
      deployment-name: ${{ vars.APP_NAME }}
      image: ${{ needs.docker-push.outputs.image }}
      manifests-path: ${{ env.DEPLOY_TARGET == 'cloud' && vars.MANIFESTS_PATH_CLOUD || vars.MANIFESTS_PATH_ONPREM }}
      manifests-external-repo: ${{ env.DEPLOY_TARGET == 'cloud' && vars.MANIFESTS_EXTERNAL_REPO || '' }}
      aws-region: ${{ vars.AWS_REGION }}
      eks-cluster-name: ${{ vars.EKS_CLUSTER_NAME }}
    secrets:
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
      AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
      AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      MANIFESTS_REPO_TOKEN: ${{ secrets.MANIFESTS_REPO_TOKEN }}
