name: CI
on:
  push:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo workspace actions
        uses: actions/checkout@v7

      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - run: java version




    
