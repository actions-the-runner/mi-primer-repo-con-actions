name: Build

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/download-java-maven
        with:
          java-version: ${{ inputs.java-version }}

      - name: Compilar
        run: mvn -B clean compile

      - name: Subir clases compiladas
        uses: actions/upload-artifact@v7
        with:
          name: compiled-classes
          path: target/
          retention-days: 
